<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laskuri</title>
</head>
<body>
  <h2>Ohtulaskuri</h2>
  <div>nappia painettu {{ value }} kertaa</div>
  <form action="/increment" method="POST">
    <button type="submit">
      Paina
    </button>
  </form>
  <form action="/reset" method="POST">
    <button type="submit">
      Nollaa
    </button>
  </form>
  <form action="/set-clicks" method="POST">
    <label for="clicks">Set clicks:</label>
    <input id="clicks" name="clicks" type="number" min="0" step="1" required>
    <button type="submit">Set clicks</button>
  </form>
</body>
</html>
